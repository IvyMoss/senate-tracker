name: Ohio results and Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'collectors/*.py'
      - '.github/workflows/ohio-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

concurrency:
  group: ohio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect Ohio results
        continue-on-error: true
        run: python3 collectors/ohio.py
      - name: Collect Alaska first-choice results
        continue-on-error: true
        run: python3 collectors/alaska.py
      - name: Collect Texas results
        continue-on-error: true
        run: python3 collectors/texas.py
      - name: Save updated snapshot
        run: |
          if git diff --quiet -- frontend/results.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/results.json
          git commit -m 'Update election snapshot'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - uses: actions/deploy-pages@v4
        id: deployment
