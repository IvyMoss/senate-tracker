name: Ohio results and Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'collectors/*.py'
      - 'collectors/*.mjs'
      - '.github/workflows/ohio-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

concurrency:
  group: ohio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect Ohio results
        continue-on-error: true
        run: python3 collectors/ohio.py
      - name: Collect Alaska first-choice results
        continue-on-error: true
        run: python3 collectors/alaska.py
      - name: Collect Texas results
        continue-on-error: true
        run: python3 collectors/texas.py
      - name: Collect Maine results
        continue-on-error: true
        run: python3 collectors/maine.py
      - name: Set up canvass PDF extraction
        continue-on-error: true
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Set up election browser
        id: election-browser
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/election-browser"
          "$RUNNER_TEMP/election-browser/bin/python" -m pip install 'playwright==1.56.0'
          "$RUNNER_TEMP/election-browser/bin/python" -m playwright install --with-deps chromium
      - name: Collect Iowa statewide Senate results
        continue-on-error: true
        env:
          IOWA_CANVASS_URL: ${{ vars.IOWA_CANVASS_URL }}
        run: |
          if [ "${{ steps.election-browser.outcome }}" = success ]; then
            "$RUNNER_TEMP/election-browser/bin/python" -B collectors/iowa.py
          else
            python3 -B collectors/iowa.py
          fi
      - name: Collect Michigan statewide Senate results
        if: steps.election-browser.outcome == 'success'
        continue-on-error: true
        run: '"$RUNNER_TEMP/election-browser/bin/python" -B collectors/michigan.py'
      - name: Collect Georgia statewide Senate results
        if: steps.election-browser.outcome == 'success'
        continue-on-error: true
        run: '"$RUNNER_TEMP/election-browser/bin/python" -B collectors/georgia.py'
      - name: Collect Kansas canvass
        continue-on-error: true
        run: python3 collectors/kansas.py
      - name: Collect North Carolina statewide Senate results
        continue-on-error: true
        run: |
          set -o pipefail
          node collectors/update-results.mjs --print-nc |
            PYTHONPATH=collectors python3 -B -c 'import json, sys; from snapshot import save_record; save_record("NC", json.load(sys.stdin))'
      - name: Collect Florida statewide Senate results
        continue-on-error: true
        run: python3 -B collectors/florida.py
      - name: Collect South Carolina statewide Senate results
        continue-on-error: true
        run: python3 -B collectors/south_carolina.py
      - name: Compare civicAPI statewide Senate results
        continue-on-error: true
        run: python3 -B collectors/civic_api.py
      - name: Compare Open America statewide Senate results
        continue-on-error: true
        run: python3 -B collectors/open_america.py
      - name: Summarize Senate results
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("frontend/results.json", encoding="utf-8") as file:
              snapshot = json.load(file)
          print("| State | Selected source | Total votes |")
          print("| --- | --- | ---: |")
          for state in "AK FL GA IA KS ME MI NC OH SC TX".split():
              record = snapshot["records"].get(state, {})
              counts = [row["votes"] for row in record.get("candidates", [])]
              total = f"{sum(counts):,}" if counts and all(v is not None for v in counts) else "Unavailable"
              print(f"| {state} | {record.get('sourceName', '—')} | {total} |")
          PYTHON
      - name: Save updated snapshot
        run: |
          if git diff --quiet -- frontend/results.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/results.json
          git commit -m 'Update election snapshot'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - uses: actions/deploy-pages@v4
        id: deployment
      # GitHub fires the cron above rarely under load, and snapshot commits made
      # with GITHUB_TOKEN never start a run, so each run queues the next one.
      # The concurrency group keeps at most one run waiting. Set the repository
      # variable PAUSE_REFRESH to true to stop the chain.
      - name: Queue the next refresh
        if: always() && github.ref == 'refs/heads/main' && vars.PAUSE_REFRESH != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261117 ]; then
            echo "Past the election-night refresh window. Not queueing another run."
            exit 0
          fi
          sleep 120
          gh workflow run ohio-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
